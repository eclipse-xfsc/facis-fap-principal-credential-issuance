name: Report UI dependency updates

# This workflow no longer commits or pushes. It checks whether the pinned UI
# runtime dependency has a newer release and, if so, opens or updates an issue
# with the details. The update itself is made by a named author in a reviewed
# pull request, like every other change (see docs/development/official-workflow.md).

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read
  issues: write

concurrency:
  group: pci-ui-dependency-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate dependency reporting
        run: node --test test/tests/static/ui-dependency-updates.test.mjs

      - name: Compare the pinned Vue version with the npm registry
        id: compare
        run: |
          pinned=$(node -p "require('./package.json').dependencies.vue")
          latest=$(npm view vue version)
          update=$(node tools/compare-ui-versions.mjs "$pinned" "$latest")
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "update=$update" >> "$GITHUB_OUTPUT"

      - name: Open or update the issue
        if: steps.compare.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PINNED: ${{ steps.compare.outputs.pinned }}
          LATEST: ${{ steps.compare.outputs.latest }}
        run: |
          title="Dependency update available: vue ${LATEST} (pinned ${PINNED})"
          body=$(cat <<EOF
          The pinned UI runtime dependency \`vue@${PINNED}\` has a newer release: \`${LATEST}\`.

          To update: a named author runs \`npm install --save-exact vue@${LATEST}\`, refreshes the vendored runtime and its provenance (\`vendor/vue.global.prod.js\`, \`vendor/vue-provenance.json\`, \`THIRD_PARTY_NOTICES.md\`), rebuilds \`dist/\`, runs the offline suite and the licence check, and opens a pull request for review. Nothing is committed by this workflow.

          Reported by the workflow run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}.
          EOF
          )
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"Dependency update available: vue\" in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
