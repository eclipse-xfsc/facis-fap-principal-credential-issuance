name: Release Node.js SBOM

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-node-sbom
  cancel-in-progress: false

jobs:
  sbom:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: v0.5.0-rc.12
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.5.0-rc.12

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Verify release and source
        run: |
          test "$RELEASE_TAG" = "v$(cat VERSION)"
          gh release view "$RELEASE_TAG"
          git rev-parse HEAD > sbom-node-source.txt

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx > sbom-node.cdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: release-node-sbom
          path: |
            sbom-node.cdx.json
            sbom-node-source.txt

      - name: Attach SBOM to existing release
        run: |
          gh release upload "$RELEASE_TAG" \
            sbom-node.cdx.json sbom-node-source.txt --clobber
