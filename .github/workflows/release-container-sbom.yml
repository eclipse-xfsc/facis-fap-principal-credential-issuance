name: Release Container SBOM

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-container-sbom
  cancel-in-progress: false

jobs:
  sbom:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: v0.5.0-rc.12
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.5.0-rc.12

      - name: Verify release and source
        run: |
          test "$RELEASE_TAG" = "v$(cat VERSION)"
          gh release view "$RELEASE_TAG"
          git rev-parse HEAD > sbom-container-source.txt

      - name: Build participant image
        run: |
          docker build --pull --platform linux/amd64 \
            -f reference/participant-data-repository/Dockerfile \
            -t fap-pci-participant:sbom .
          docker image inspect fap-pci-participant:sbom \
            > sbom-container-image.json

      - name: Generate container SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: fap-pci-participant:sbom
          syft-version: v1.54.1
          format: cyclonedx-json
          output-file: sbom-container.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - uses: actions/upload-artifact@v4
        with:
          name: release-container-sbom
          path: |
            sbom-container.cdx.json
            sbom-container-source.txt
            sbom-container-image.json

      - name: Attach SBOM to existing release
        run: |
          gh release upload "$RELEASE_TAG" \
            sbom-container.cdx.json \
            sbom-container-source.txt \
            sbom-container-image.json --clobber
