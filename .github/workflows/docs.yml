name: Documentation
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the reviewed documentation to GitHub Pages
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install mkdocs==1.6.1
      - run: mkdocs build --strict
      - uses: actions/upload-artifact@v4
        with: {name: pci-documentation, path: site}
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        with: {path: site}
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish reviewed documentation
        id: deployment
        uses: actions/deploy-pages@v4
