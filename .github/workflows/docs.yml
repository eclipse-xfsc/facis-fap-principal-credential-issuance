name: Documentation
# Builds the site strictly on every push and pull request. Publishes to GitHub
# Pages on every push to main and every release candidate tag, so the published
# site is always the reviewed documentation of main or of the latest tag;
# workflow_dispatch with publish=true republishes on demand.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the reviewed documentation to GitHub Pages
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install mkdocs==1.6.1
      - run: mkdocs build --strict
      - name: Record the documented version
        run: echo "$(cat VERSION) $(git rev-parse HEAD)" > site/VERSION.txt
      - uses: actions/upload-artifact@v4
        with: {name: pci-documentation, path: site}
      - uses: actions/upload-pages-artifact@v3
        if: (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
        with: {path: site}
  publish:
    if: (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish reviewed documentation
        id: deployment
        uses: actions/deploy-pages@v4
